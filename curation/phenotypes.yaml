# HPO terms the atlas cites: cardiac lesion terms, with the browse facet each
# belongs to, plus extracardiac features registered here only so their labels
# get checked. Labels and synonyms are transcribed from the pinned HPO release
# named in mirrors/sources.yaml; `lesion_group` is the atlas's own facet
# assignment and is absent for a term that is not a cardiac lesion.
phenotypes:
  - id: HP:0001631
    label: Atrial septal defect
    lesion_group: septal
    synonyms:
      - ASD
  - id: HP:0001629
    label: Ventricular septal defect
    lesion_group: septal
    synonyms:
      - VSD
  # Extracardiac feature (TBX5/Holt-Oram syndrome, CHDA:AST:0000001) -- not a
  # cardiac lesion, so no `lesion_group`.
  - id: HP:0009601
    label: Aplasia/Hypoplasia of the thumb
    synonyms:
      - Absent or hypoplastic thumbs
  # NR2F2-related MCA/dysmorphic syndrome (CHDA:AST:0000002). HP:0006695 is the
  # generic AVSD term; HP:0001647 (BAV) and HP:0030853 (heterotaxy) broaden the
  # lesion spectrum beyond the septal defects above.
  - id: HP:0006695
    label: Atrioventricular canal defect
    lesion_group: avsd
    synonyms:
      - Atrioventricular septal defect
      - Endocardial cushion defect
  - id: HP:0001647
    label: Bicuspid aortic valve
    lesion_group: lvoto
    synonyms:
      - BAV
  - id: HP:0030853
    label: Heterotaxy
    lesion_group: heterotaxy
    synonyms:
      - Heterotaxia
  # Extracardiac features of the NR2F2 syndrome (CHDA:AST:0000002) -- not
  # cardiac lesions, so no `lesion_group`.
  - id: HP:0001746
    label: Asplenia
    synonyms:
      - Absent spleen
  - id: HP:0000776
    label: Congenital diaphragmatic hernia
    synonyms:
      - Diaphragmatic hernia
