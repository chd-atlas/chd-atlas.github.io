# Every record here is transcribed from the PubMed entry for its PMID, except
# `study_type`: PubMed has no study-design field, so that value is read off the
# paper itself and the reading is recorded alongside it.
# `title` is NCBI's ArticleTitle verbatim: the "[corrected]" marker is PubMed's
# own annotation of the erratum at Nat Genet 1997 Apr;15(4):411, and `journal`
# is NLM's full journal title (ISO abbreviation "Nat Genet").
