findings:
  - id: CHDA:LIT:0000015
    publication: PMID:12789647
    design: cohort_screen
    methods: [targeted_sequencing]
    count_unit: probands
    screened: 49
    carriers: {de_novo: 0, inherited: 0, origin_unknown: 17}
    variant_classes: [snv_indel]
    phenotypes: [HP:0001631, HP:0001629, HP:0006695]
    lesion_groups: [septal, avsd]
    syndromic: syndromic
    shares_probands_with: unknown
    locators:
      - kind: in_text
        element: Results, first paragraph (17 of 49 probands)
      - kind: in_text
        element: Material and Methods, Mutation Analysis (complete sequence data for 49 of 55 probands)
      - kind: in_text
        element: Table 1
    summary: Sanger sequencing of TBX5 exons 1-9 in probands with a putative diagnosis of Holt-Oram syndrome found a TBX5 mutation in 17 of the 49 probands with complete sequence data (14 different mutations; 55 probands were recruited). Mutations were found in 9 of 17 familial and 8 of 32 sporadic cases.
    extracted_by: agent:literature-extract/claude-sonnet-5-5
  - id: CHDA:LIT:0000016
    publication: PMID:18828908
    design: case_report
    methods: [targeted_sequencing]
    count_unit: probands
    screened: 1
    carriers: {de_novo: 1, inherited: 0, origin_unknown: 0}
    variant_classes: [snv_indel]
    phenotypes: [HP:0001631, HP:0001629, HP:0001678]
    lesion_groups: [septal]
    syndromic: syndromic
    shares_probands_with: unknown
    locators:
      - kind: in_text
        element: Results, Mutation analysis (c.1333delC found in the patient, not in his parents)
      - kind: in_text
        element: Methods, Case report
    summary: A 4-year-old boy with classical Holt-Oram syndrome (atrial and muscular ventricular septal defects, atrioventricular block needing a pacemaker) carried a heterozygous TBX5 frameshift c.1333delC (p.H445fsX136), absent from both parents and predicted to extend the protein.
    extracted_by: agent:literature-extract/claude-sonnet-5-5
  - id: CHDA:LIT:0000017
    publication: PMID:21637475
    design: cohort_screen
    methods: [targeted_sequencing]
    count_unit: probands
    screened: 9
    carriers: {de_novo: 2, inherited: 0, origin_unknown: 2}
    variant_classes: [snv_indel]
    phenotypes: [HP:0001631, HP:0001629, HP:0006695]
    lesion_groups: [septal, avsd]
    syndromic: syndromic
    shares_probands_with: unknown
    locators:
      - kind: in_text
        element: Abstract (four HOS patients with pathogenic TBX5 mutations)
      - kind: in_text
        element: Results, paragraphs on patients HH17, HH20, HH24 and HH8
      - kind: in_text
        element: Table 1
    summary: Direct sequencing of TBX5 in 9 unrelated patients with typical (8) or atypical (1) Holt-Oram syndrome found a pathogenic TBX5 mutation in four (c.835C>T p.R279X in two, one of them de novo; c.374delG, de novo; c.678G>T p.K226N, also in the patient's affected father); origin is not stated for the other two carriers.
    extracted_by: agent:literature-extract/claude-sonnet-5-5
  - id: CHDA:LIT:0000018
    publication: PMID:21637475
    design: cohort_screen
    methods: [targeted_sequencing]
    count_unit: probands
    screened: 16
    carriers: {de_novo: 0, inherited: 0, origin_unknown: 0}
    variant_classes: [snv_indel]
    phenotypes: [HP:0001627]
    lesion_groups: [other]
    syndromic: isolated
    shares_probands_with: unknown
    locators:
      - kind: in_text
        element: Results, paragraph on the 16 patients with isolated heart anomalies (no pathogenic TBX5 variant)
      - kind: in_text
        element: Table 1 (CHD5)
    summary: No pathogenic TBX5 variant was found by direct sequencing in 16 unrelated patients with isolated congenital heart defects; one (CHD5, ostium secundum ASD) carried only the TBX5 c.309C>T variant that the authors class as a silent polymorphism.
    extracted_by: agent:literature-extract/claude-sonnet-5-5
  - id: CHDA:LIT:0000019
    publication: PMID:22190901
    design: case_report
    methods: [targeted_sequencing]
    count_unit: probands
    screened: 1
    carriers: {de_novo: 1, inherited: 0, origin_unknown: 0}
    variant_classes: [snv_indel]
    phenotypes: [HP:0001631, HP:0001629, HP:0001643]
    lesion_groups: [septal]
    syndromic: syndromic
    shares_probands_with: unknown
    locators:
      - kind: in_text
        element: Case Report, paragraph on molecular analysis (c.1304delT; parents' results normal; Fig. 3)
    summary: A boy with sporadic Holt-Oram syndrome (muscular ventricular septal defect, sinus venosus-type atrial septal defect, patent ductus arteriosus, conduction defect) carried a heterozygous TBX5 frameshift c.1304delT (p.L435fsX146); the parents tested normal.
    extracted_by: agent:literature-extract/claude-sonnet-5-5
  - id: CHDA:LIT:0000020
    publication: PMID:22011241
    design: cohort_screen
    methods: [targeted_sequencing]
    count_unit: probands
    screened: 331
    carriers: {de_novo: 0, inherited: 0, origin_unknown: 1}
    variant_classes: [snv_indel]
    phenotypes: [HP:0001627]
    lesion_groups: [other]
    syndromic: isolated
    shares_probands_with: unknown
    locators:
      - kind: in_text
        element: Methods, Patients and Samples (331 patients)
      - kind: in_text
        element: Results, paragraph on the TBX5 gene (D111Y, 3 of 384 controls)
      - kind: in_text
        element: Discussion, paragraph on the novel D111Y TBX5 variant
    summary: dHPLC and sequencing of TBX5 in 331 patients with sporadic non-syndromic congenital heart disease found one variant, D111Y (c.998G>T), in a patient with double outlet right ventricle, VSD, ASD and PDA; it was also present in 3 of 384 controls, and the authors propose it as a susceptibility candidate for future case-control study.
    extracted_by: agent:literature-extract/claude-sonnet-5-5
    review_status: pending_review
    review_note: The Results call the one TBX5 change "a synonymous variant" while naming it D111Y, a protein substitution; the Discussion treats it as a nonsynonymous variant.
  - id: CHDA:LIT:0000021
    publication: PMID:22333898
    design: family_segregation
    methods: [chromosomal_microarray, gene_panel, targeted_sequencing]
    count_unit: families
    screened: 1
    carriers: {de_novo: 0, inherited: 0, origin_unknown: 1}
    variant_classes: [cnv]
    phenotypes: [HP:0006695, HP:0004383, HP:0001642]
    lesion_groups: [avsd, lvoto, rvoto]
    syndromic: syndromic
    shares_probands_with: unknown
    locators:
      - kind: in_text
        element: Abstract and Results, Identification of duplication on chromosome 12 using array-comparative genomic hybridisation (48 kb duplication, exons 2-9, array-CGH in the consultand and in III:3 and V:1)
      - kind: in_text
        element: Results, Confirmation of duplication of the TBX5 gene by MLPA (heterozygous duplication of exons 2-9 in other family members, 7/11, segregating with clinically affected members only; Table 2 is not in the available text)
      - kind: in_text
        element: Clinical report, Family members and Table 1 (9 of 12 members affected over five generations; AVSD with pulmonary stenosis in IV:3, HLHS in V:1)
    summary: A five-generation family with nine affected members and an atypical Holt-Oram phenotype (AVSD with pulmonary stenosis, hypoplastic left heart syndrome, mitral valve disease and conduction abnormalities, with mild ulnar-predominant limb defects) carried a heterozygous 48 kb duplication of TBX5 exons 2-9 that the authors report segregates with the clinically affected members; sequencing of exons 3-10 had found no variant.
    extracted_by: agent:literature-extract/claude-sonnet-5-5
