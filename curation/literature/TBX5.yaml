findings:
  - id: CHDA:LIT:0000015
    publication: PMID:12789647
    design: cohort_screen
    methods: [targeted_sequencing]
    count_unit: probands
    screened: 49
    carriers: {de_novo: 0, inherited: 9, origin_unknown: 8}
    variant_classes: [snv_indel]
    phenotypes: [HP:0001629, HP:0001631, HP:0001674, HP:0001684, HP:0001719, HP:0006695, HP:0011623, HP:0011625, HP:0011682]
    lesion_groups: [septal, avsd, conotruncal]
    syndromic: syndromic
    shares_probands_with: unknown
    locators:
      - kind: in_text
        element: Results, first paragraph (17 of 49 probands)
      - kind: in_text
        element: Material and Methods, Mutation Analysis (complete sequence data for 49 of 55 probands)
      - kind: in_text
        element: Table 1
    summary: Sanger sequencing of TBX5 exons 1-9 in probands with a putative diagnosis of Holt-Oram syndrome found a TBX5 mutation in 17 of the 49 probands with complete sequence data (14 different mutations; 55 probands were recruited). Mutations were found in 9 of 17 familial and 8 of 32 sporadic cases.
    extracted_by: agent:literature-extract/claude-sonnet-5-5
    approved_by: E.A.M
    approved_on: 2026-11-03
    approved_digest: sha256:66fbbe5387ae68253831f7957b3e1b2ccdf426b887a5247030efac99ae3df963
  - id: CHDA:LIT:0000016
    publication: PMID:18828908
    design: case_report
    methods: [targeted_sequencing]
    count_unit: probands
    screened: 1
    carriers: {de_novo: 1, inherited: 0, origin_unknown: 0}
    variant_classes: [snv_indel]
    phenotypes: [HP:0001631, HP:0005304, HP:0011623]
    lesion_groups: [other, septal]
    syndromic: syndromic
    shares_probands_with: unknown
    locators:
      - kind: in_text
        element: Results, Mutation analysis (c.1333delC found in the patient, not in his parents)
      - kind: in_text
        element: Methods, Case report
    summary: A 4-year-old boy with classical Holt-Oram syndrome (atrial and muscular ventricular septal defects, atrioventricular block needing a pacemaker) carried a heterozygous TBX5 frameshift c.1333delC (p.H445fsX136), absent from both parents and predicted to extend the protein.
    extracted_by: agent:literature-extract/claude-sonnet-5-5
    verified_by: agent:literature-verify/claude-opus-5-5
    approved_by: E.A.M
    approved_on: 2026-11-03
    approved_digest: sha256:0a6343e011a94a0b1e921f73ec681a07b02b77a1a57058b132ac1c6a8937ac7b
  - id: CHDA:LIT:0000017
    publication: PMID:21637475
    design: cohort_screen
    methods: [targeted_sequencing]
    count_unit: probands
    screened: 9
    carriers: {de_novo: 2, inherited: 1, origin_unknown: 1}
    variant_classes: [snv_indel]
    phenotypes: [HP:0001631, HP:0001684, HP:0001629, HP:0006695, HP:0001642]
    lesion_groups: [septal, avsd, rvoto]
    syndromic: syndromic
    shares_probands_with: unknown
    locators:
      - kind: in_text
        element: Abstract (four HOS patients with pathogenic TBX5 mutations)
      - kind: in_text
        element: Results, paragraphs on patients HH17, HH20, HH24 and HH8
      - kind: in_text
        element: Table 1
    summary: Direct sequencing of TBX5 in 9 unrelated patients with typical (8) or atypical (1) Holt-Oram syndrome found a pathogenic TBX5 mutation in four (c.835C>T p.R279X in two, one of them de novo; c.374delG, de novo; c.678G>T p.K226N, inherited, also in the patient's affected father); the origin of the other c.835C>T carrier is not stated.
    extracted_by: agent:literature-extract/claude-sonnet-5-5
    approved_by: E.A.M
    approved_on: 2026-11-03
    approved_digest: sha256:56bbd131464392b9b081dc89ee07c118f8eed980ff10f1cd45122dd5e13cc6f2
  - id: CHDA:LIT:0000018
    publication: PMID:21637475
    design: cohort_screen
    methods: [targeted_sequencing]
    count_unit: probands
    screened: 16
    carriers: {de_novo: 0, inherited: 0, origin_unknown: 0}
    variant_classes: [snv_indel]
    phenotypes: [HP:0001627]
    lesion_groups: [other]
    syndromic: isolated
    shares_probands_with: unknown
    locators:
      - kind: in_text
        element: Results, paragraph on the 16 patients with isolated heart anomalies (no pathogenic TBX5 variant)
      - kind: in_text
        element: Table 1 (CHD5)
    summary: No pathogenic TBX5 variant was found by direct sequencing in 16 unrelated patients with isolated congenital heart defects; one (CHD5, ostium secundum ASD) carried only the TBX5 c.309C>T variant that the authors class as a silent polymorphism. The heart defects recorded are the cohort's, since the paper gives no lesion type for the cohort as a whole.
    extracted_by: agent:literature-extract/claude-sonnet-5-5
