    summary: Two brothers with visceral heterotaxy, dextro-transposition of the great arteries and total anomalous pulmonary venous return carried a maternal 5,904 bp deletion of MMP21 exons 1-3 in trans with a paternal frameshift (c.365del), found by whole-genome sequencing of the quartet; the frameshift was called apparently homozygous, which the authors attribute to the deletion of the maternal allele. The ventricular septal defect, dextrocardia, pulmonary valve atresia and interrupted inferior vena cava are from the supplementary sample table (rows 53-58), which names BCL9L, not MMP21, as the brothers' causal gene.
    extracted_by: agent:literature-extract/claude-sonnet-5-5
    approved_by: E.A.M
