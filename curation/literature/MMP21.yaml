    summary: HaloPlex sequencing of MMP21 in 264 index cases with heterotaxy (154) or non-heterotaxy congenital heart disease (110) found nine cases (families 3-11) with rare biallelic variants predicted to affect protein function; the authors judge the variants of families 10 and 11 unlikely to be causal (one variant seen homozygous in ExAC), so seven carriers (families 3-9, nine less two) are counted. The text ties only p.(Ala321Pro) to a family (family 6) and names p.(Arg360Cys), p.(Arg375His), p.(Arg408Gly) and residue Glu215 without a family; the per-family variants and the carriers' lesions are in Supplementary Table 2 and Figure 1, not read, so the lesions are the series'.
