    summary: In one consanguineous Arab family, exome sequencing and Sanger segregation testing found a homozygous 2 bp deletion in MMP21 (c.1024_1025delAA) in two siblings with heterotaxy and complex heart disease (complete atrioventricular canal defect and transposition with pulmonary atresia in both, dextrocardia in one, bilateral superior vena cava in the other) and in a third homozygous sibling with situs inversus totalis. The parents were heterozygous.
    extracted_by: agent:literature-extract/claude-sonnet-5-5
