    approved_digest: sha256:00086d849570e23c4d3210bc9f17cb2aeae3799ca230a38ddab02424ab6507ae
    review_status: pending_review
    review_note: The text gives the brothers' diagnosis as MMP21 (an exon 1-3 deletion in trans with c.365del); the supplementary sample table (npjgenmed201626-s7.xlsx, Sheet1, rows 53-62) names BCL9L (NM_182557.2:c.2102G>A and c.554C>T, recessive) as the causal gene for CMH184 and CMH185 and lists no MMP21 variant.
    review_settled_by: authors
