    summary: Five rare missense variants in NR2F2 (two de novo, two inherited from an unaffected parent, one with parental DNA unavailable) were found among 125 exome-sequenced individuals with nonsyndromic atrioventricular septal defects, against 5,194 population-matched controls (Fisher's exact p = 7.7e-7, odds ratio 54.1).
