    summary: "A series ascertained for the variant, not a CHD cohort: 16 unrelated probands, each with congenital heart disease and a rare heterozygous NR2F2 variant (15 single-nucleotide variants, one 1.87 Mb deletion of the whole gene), reported by clinicians from many centres; trio exome sequencing for all but case 8 (father untested) and case 12 (chromosomal microarray). The series was gathered because of the variant, so no number of people screened exists and screened equals the carriers counted. The heart lesions are the series' own, with counts over all 17 individuals the paper describes (the 16 probands and the proband's mildly affected mosaic mother), namely atrial septal defect 8, coarctation of the aorta 8, ventricular septal defect 5, aortic arch anomalies 3, atrioventricular septal defect 2, plus valvular and supravalvular pulmonic stenosis, an aberrant left subclavian artery, tricuspid regurgitation and bicuspid aortic valve among the less common defects, and an aberrant right subclavian artery seen prenatally in individual 15. Two of the variants were found in the DDD study. Origin is derived, not printed as such. Individual 5-1's variant was inherited from a mosaic mother, and the paper says the inheritance of two others is unknown (from the text, individuals 8 and 9), so de novo is the 16 probands less those 3."
