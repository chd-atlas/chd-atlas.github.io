    # asserted: EMBL-EBI's own licensing page states that no single licence is
    # mandated across resources, and this experiment's IDF declares none.
    licence: EMBL-EBI Terms of Use
    redistribution: permitted_with_attribution
  - id: farah2024_hoc
    name: >-
      Farah et al. 2024 developing human heart scRNA-seq, UCSC Cell Browser
