    # job 21367175, 2026-11-02; the two `hvantk expression summarize` commands
    # are in scripts/hpc/farah_celltypes.sbatch). Its pseudobulk.tsv (sha256
    # 3414fe0cf47b5f2ce4c46460fed151131dce365b14ca2d2eae06671be9dd59d9) is
    # turned into mirrors/cell_type_profiles/hoc.tsv by
