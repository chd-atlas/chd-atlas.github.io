name: validate

on:
  pull_request:
  push:
    # `dev` is the working branch and the default branch, so most commits land
    # there directly rather than through a pull request. Without it listed here
    # those commits get no CI at all, which is how a push to `dev` came to sit
    # unvalidated on the remote.
    branches: [main, dev]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # `uv sync --locked` installs into a project .venv from the committed
      # uv.lock and fails if the lock has drifted from pyproject.toml, so CI
      # tests the exact dependency set the repository pins.
      #
      # Not `uv pip install --system`: that targets whichever python3 the runner
      # image exposes, which on ubuntu-latest is externally managed, and it would
      # ignore uv.lock entirely. Every step below therefore runs through `uv run`,
      # which resolves console scripts from the project environment.
      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run ruff check .

      # `ruff check` and `ruff format` are separate tools with separate rule
      # sets, and only the first was run here. Fifteen files had drifted out of
      # formatted shape with CI green throughout, because nothing was asking.
      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Unit tests
        run: uv run pytest -v

      # The gate this whole plan exists for. Hermetic: every input is a
      # repo-local path, including the pinned ontology release.
      - name: Validate curation corpus
        run: uv run chd-atlas validate

  # Decision 9: this runs on EVERY pull request, not only those touching
  # `mirrors/` or `curation/`. A code change can move published bytes just as a
  # data change can, and a path filter would be one more branch that can hide
  # one. The job only reads, builds and comments (D6): CI never writes data or
  # commits anything; a curator runs `chd-atlas ingest` and reviews this report.
  site-changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Full history, because the base commit must exist locally for
      # `git worktree add` below; the default shallow clone has only the merge ref.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Building needs no dev extra (pytest, ruff and mypy are not imported by
      # `chd-atlas build`), so only the locked runtime set is installed.
      - name: Install dependencies
        run: uv sync --locked

      - name: Build the head site
        run: uv run chd-atlas build --root . --out "$RUNNER_TEMP/head-site"

      # The base is checked out beside the head so it can be built with ITS OWN
      # code below. Comparing a head build against a base built by the head's
      # code would hide exactly what a code PR changes.
      - name: Check out the base commit
        run: git worktree add "$RUNNER_TEMP/base" "${{ github.event.pull_request.base.sha }}"

      # `--project` makes uv use the base's pyproject and uv.lock and create its
      # own environment under the worktree; `--locked` fails on a drifted lock
      # rather than silently resolving anew.
      - name: Build the base site with the base's own code
        run: >
          uv run --locked --project "$RUNNER_TEMP/base" chd-atlas build
          --root "$RUNNER_TEMP/base" --out "$RUNNER_TEMP/base-site"

      # The head's code compares the two built sites and two checkouts, so the
      # report logic is the version under review even when the base predates it.
      - name: Write the site-change report
        run: >
          uv run chd-atlas report-changes
          --base-root "$RUNNER_TEMP/base" --base-site "$RUNNER_TEMP/base-site"
          --head-root . --head-site "$RUNNER_TEMP/head-site"
          --out "$RUNNER_TEMP/report.md"

      # One comment per pull request, found by the marker the report opens with
      # and updated in place on every push, so the thread does not fill with
      # stale reports. A missing or empty report fails the step: a silent
      # no-op comment would read as "nothing changed".
      - name: Post or update the comment
        run: |
          set -euo pipefail
          if [ ! -s "$RUNNER_TEMP/report.md" ]; then
            echo "report.md is missing or empty" >&2
            exit 1
          fi
          api="repos/${{ github.repository }}"
          ids=$(gh api --paginate "$api/issues/${{ github.event.pull_request.number }}/comments" \
            --jq '.[] | select(.body | startswith("<!-- chd-atlas:site-change-report -->")) | .id')
          # First match only; `head` in the pipe would SIGPIPE gh under pipefail.
          id=${ids%%$'\n'*}
          if [ -n "$id" ]; then
            gh api -X PATCH "$api/issues/comments/$id" -F body=@"$RUNNER_TEMP/report.md"
          else
            gh api -X POST "$api/issues/${{ github.event.pull_request.number }}/comments" -F body=@"$RUNNER_TEMP/report.md"
          fi
